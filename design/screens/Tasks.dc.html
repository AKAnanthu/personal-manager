<div style="width: 390px; height: 844px; background: #F7F8F6; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1A1D1C; display: flex; flex-direction: column; overflow: hidden; position: relative">

      </div>
      <div style="display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-bottom: 1px solid #EEF1EF">
        <button aria-label="Mark Return library books done" style="width: 28px; height: 28px; border: 2px solid #0F6B5C; border-radius: 8px; background: transparent; flex: none; padding: 0"></button>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Return library books</span><span style="font-size: 12px; color: #5B6461">Due 20 Nov</span></div>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; padding: 12px 14px">
        <button aria-label="Mark Clean out wardrobe done" style="width: 28px; height: 28px; border: 2px solid #0F6B5C; border-radius: 8px; background: transparent; flex: none; padding: 0"></button>

</div>
