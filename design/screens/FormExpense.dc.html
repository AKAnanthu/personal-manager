<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add expense</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#0F6B5C}a:hover{color:#0A4F44}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lab{font-size:13px;font-weight:600;color:#3E4643}
.inp{height:52px;border:1px solid #C9D1CE;border-radius:14px;background:#FFFFFF;padding:0 14px;font:500 15px 'Plus Jakarta Sans',sans-serif;color:#1A1D1C;width:100%}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #F7F8F6; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1A1D1C; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 4px; padding: 12px 8px 4px">
    <a href="Budget.dc.html" aria-label="Cancel" style="width: 48px; height: 48px; border-radius: 24px; color: #1A1D1C; display: flex; align-items: center; justify-content: center"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 700; flex: 1">Add expense</h1>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 8px 16px 24px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 28px 0 12px">
      <label for="amt" class="lab">Amount</label>
      <div style="display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid #0F6B5C; padding: 0 12px 6px">
        <span style="font-size: 32px; font-weight: 700; color: #5B6461">₹</span>
        <input id="amt" inputmode="decimal" value="350" style="width: 150px; border: 0; outline: none; background: transparent; font: 700 48px 'Plus Jakarta Sans', sans-serif; color: #1A1D1C; text-align: center">
      </div>
      <span style="font-size: 13px; color: #3E4643">Leaves <strong style="color: #0A4F44">₹10,330</strong> of ₹25,000 this month</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px"><label class="lab" for="d">Description <span style="font-weight: 500; color: #5B6461">(optional)</span></label><input class="inp" id="d" value="Auto fare to hospital"></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><label class="lab" for="dt">Date</label>
      <div style="position: relative"><input class="inp" id="dt" value="Today, 3 Nov 2026" style="padding-left: 42px"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24" style="position: absolute; left: 12px; top: 14px; width: 20px; height: 20px; color: #5B6461"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></div></div>

    <p style="margin: 0; font-size: 12px; color: #5B6461; line-height: 1.45">Shopping totals are added here automatically when you finish a shopping trip — no need to enter them again.</p>

    <a href="Budget.dc.html" style="margin-top: auto; height: 56px; text-decoration: none; border-radius: 28px; background: #0F6B5C; color: #FFFFFF; font: 700 16px 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; justify-content: center">Save expense</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
