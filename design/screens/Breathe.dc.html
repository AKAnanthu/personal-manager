<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Eye rest and breathing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#0F6B5C}a:hover{color:#0A4F44}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes breathe{0%,100%{transform:scale(.62)}50%{transform:scale(1)}}
@keyframes inTxt{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
@keyframes outTxt{0%,45%{opacity:0}50%,95%{opacity:1}100%{opacity:0}}
.orb{animation:breathe 8s ease-in-out infinite}
.tin{animation:inTxt 8s linear infinite}
.tout{animation:outTxt 8s linear infinite}
@media (prefers-reduced-motion: reduce){.orb,.tin,.tout{animation:none}.tout{opacity:0}}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #EAF3F0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1A1D1C; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 4px; padding: 12px 8px 4px">
    <a href="Main.dc.html" aria-label="Close" style="width: 48px; height: 48px; border-radius: 24px; color: #1A1D1C; display: flex; align-items: center; justify-content: center"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 700; flex: 1">Eye rest &amp; breathing</h1>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 24px 24px 28px">
    <p style="margin: 0; font-size: 15px; color: #3E4643; text-align: center; line-height: 1.5">Look away from the screen, relax your shoulders and follow the circle.</p>

    <div style="width: 290px; height: 290px; position: relative; display: flex; align-items: center; justify-content: center">
      <div aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid #BFD9D2"></div>
      <div class="orb" aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; background: #B9DDD3"></div>
      <div class="orb" aria-hidden="true" style="position: absolute; inset: 40px; border-radius: 50%; background: #0F6B5C"></div>
      <div style="position: relative; display: grid; place-items: center; color: #FFFFFF" aria-live="polite">
        <span class="tin" style="grid-area: 1 / 1; font-size: 28px; font-weight: 700">Breathe in</span>
        <span class="tout" style="grid-area: 1 / 1; font-size: 28px; font-weight: 700">Breathe out</span>
      </div>
    </div>

    <span style="font-size: 15px; font-weight: 600; color: #24524A">2:35 remaining · 4 s in, 4 s out</span>

    <div style="display: flex; flex-direction: column; gap: 8px; align-items: center">
      <span style="font-size: 13px; font-weight: 700; color: #3E4643">Duration</span>
      <div style="display: flex; gap: 8px">
        <button aria-pressed="false" style="height: 40px; padding: 0 16px; border: 1px solid #A9C4BC; border-radius: 20px; background: transparent; color: #24524A; font: 600 14px 'Plus Jakarta Sans', sans-serif">1 min</button>
        <button aria-pressed="true" style="height: 40px; padding: 0 16px; border: 0; border-radius: 20px; background: #0F6B5C; color: #FFFFFF; font: 600 14px 'Plus Jakarta Sans', sans-serif">3 min</button>
        <button aria-pressed="false" style="height: 40px; padding: 0 16px; border: 1px solid #A9C4BC; border-radius: 20px; background: transparent; color: #24524A; font: 600 14px 'Plus Jakarta Sans', sans-serif">5 min</button>
      </div>
    </div>

    <div style="display: flex; gap: 20px; font-size: 14px; font-weight: 600; color: #24524A">
      <label style="display: flex; align-items: center; gap: 8px; min-height: 44px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #0F6B5C; margin: 0">Completion sound</label>
      <label style="display: flex; align-items: center; gap: 8px; min-height: 44px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #0F6B5C; margin: 0">Vibration</label>
    </div>

    <div style="margin-top: auto; width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button style="height: 56px; border: 1px solid #A9C4BC; border-radius: 28px; background: transparent; color: #0A4F44; font: 700 15px 'Plus Jakarta Sans', sans-serif">Stop</button>
      <button style="height: 56px; border: 0; border-radius: 28px; background: #0F6B5C; color: #FFFFFF; font: 700 15px 'Plus Jakarta Sans', sans-serif">Pause</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
