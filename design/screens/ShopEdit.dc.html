<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit shopping list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#0F6B5C}a:hover{color:#0A4F44}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.f{height:44px;border:1px solid #D3DAD7;border-radius:12px;background:#FFFFFF;font:500 15px 'Plus Jakarta Sans',sans-serif;color:#1A1D1C;padding:0 10px;min-width:0;width:100%}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #F7F8F6; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1A1D1C; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 4px; padding: 12px 8px 4px">
    <a href="ShopHome.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; color: #1A1D1C; display: flex; align-items: center; justify-content: center"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1 style="margin: 0; font-size: 22px; font-weight: 700; flex: 1">Edit list</h1>
    <a href="ShopHome.dc.html" style="height: 40px; padding: 0 14px; font-size: 14px; font-weight: 700; text-decoration: none; display: flex; align-items: center; margin-right: 4px">Save</a>
  </div>

  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 4px 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="ln" style="font-size: 13px; font-weight: 600; color: #3E4643">List name</label>
      <input id="ln" value="Weekly groceries" style="height: 52px; border: 2px solid #0F6B5C; border-radius: 14px; background: #FFFFFF; padding: 0 14px; font: 600 17px 'Plus Jakarta Sans', sans-serif; color: #1A1D1C">
      <span style="font-size: 12px; color: #5B6461; display: flex; align-items: center; gap: 6px"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24" style="width: 14px; height: 14px"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>Copied from the 27 Oct list — change anything before you start</span>
    </div>

    <div style="display: grid; grid-template-columns: minmax(0, 1fr) 60px 70px 36px; gap: 6px; padding: 0 2px; font-size: 12px; font-weight: 700; color: #5B6461">
      <span>Item · {{count}}</span><span>Qty</span><span>Unit</span><span></span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
        <div style="display: grid; grid-template-columns: minmax(0, 1fr) 60px 70px 36px; gap: 6px; align-items: center">
          <input class="f" aria-label="Item name" value="{{it.name}}">
          <input class="f" aria-label="Quantity" value="{{it.qty}}">
          <input class="f" aria-label="Unit" value="{{it.unit}}" placeholder="—">
          <button onClick="{{it.remove}}" aria-label="Remove item" style="width: 36px; height: 44px; border: 0; background: transparent; color: #5B6461; padding: 0; display: flex; align-items: center; justify-content: center"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg></button>
        </div>
      </sc-for>
    </div>

    <div style="background: #FFFFFF; border: 1px dashed #9FB0AA; border-radius: 14px; padding: 8px; display: grid; grid-template-columns: minmax(0, 1fr) 60px 44px; gap: 6px; align-items: center">
      <input class="f" aria-label="New item name" placeholder="Add an item…" value="{{draft}}" onChange="{{onDraft}}" style="border: 0">
      <input class="f" aria-label="New item quantity" placeholder="Qty" value="{{draftQty}}" onChange="{{onDraftQty}}">
      <button onClick="{{add}}" aria-label="Add item" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: #0F6B5C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <span style="font-size: 12px; color: #5B6461">Tip: paste several lines here and each becomes its own item.</span>
  </div>

  <div style="background: #FFFFFF; border-top: 1px solid #E3E7E5; padding: 12px 16px 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <a href="ShopHome.dc.html" style="height: 56px; text-decoration: none; border: 1px solid #B9C4C0; border-radius: 28px; background: #FFFFFF; color: #0A4F44; font: 700 15px 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; justify-content: center">Save for later</a>
    <a href="ShopActive.dc.html" style="height: 56px; text-decoration: none; border-radius: 28px; background: #0F6B5C; color: #FFFFFF; font: 700 15px 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; justify-content: center">Start shopping</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      next: 8,
      draft: '',
      draftQty: '',
      items: [
        { id: 1, name: 'Milk', qty: '2', unit: '' },
        { id: 2, name: 'Bread', qty: '1', unit: '' },
        { id: 3, name: 'Rice', qty: '5', unit: 'kg' },
        { id: 4, name: 'Sugar', qty: '2', unit: 'kg' },
        { id: 5, name: 'Eggs', qty: '12', unit: '' },
        { id: 6, name: 'Soap', qty: '4', unit: '' },
        { id: 7, name: 'Tea powder', qty: '250', unit: 'g' }
      ]
    };
  }
  renderVals() {
    const s = this.state;
    const items = s.items.map((x) => ({ ...x, remove: () => this.setState({ items: this.state.items.filter((y) => y.id !== x.id) }) }));
    return {
      items,
      count: items.length,
      draft: s.draft,
      draftQty: s.draftQty,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onDraftQty: (e) => this.setState({ draftQty: e.target.value }),
      add: () => {
        const name = this.state.draft.trim();
        if (!name) return;
        this.setState({
          items: [...this.state.items, { id: this.state.next, name, qty: this.state.draftQty.trim() || '1', unit: '' }],
          next: this.state.next + 1, draft: '', draftQty: ''
        });
      }
    };
  }
}
</script>
</body>
</html>
