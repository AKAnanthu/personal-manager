<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New reminder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#0F6B5C}a:hover{color:#0A4F44}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lab{font-size:13px;font-weight:600;color:#3E4643}
.inp{height:52px;border:1px solid #C9D1CE;border-radius:14px;background:#FFFFFF;padding:0 14px;font:500 15px 'Plus Jakarta Sans',sans-serif;color:#1A1D1C;width:100%}
.chip{height:40px;padding:0 14px;border:1px solid #C9D1CE;border-radius:20px;background:#FFFFFF;color:#3E4643;font:600 13px 'Plus Jakarta Sans',sans-serif}
.chip[aria-pressed=true]{border:0;background:#0F6B5C;color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #F7F8F6; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1A1D1C; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 4px; padding: 12px 8px 4px">
    <a href="Reminders.dc.html" aria-label="Cancel" style="width: 48px; height: 48px; border-radius: 24px; color: #1A1D1C; display: flex; align-items: center; justify-content: center"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 700; flex: 1">New reminder</h1>
    <a href="Reminders.dc.html" style="height: 40px; padding: 0 18px; text-decoration: none; border-radius: 20px; background: #0F6B5C; color: #FFFFFF; font: 700 14px 'Plus Jakarta Sans', sans-serif; margin-right: 8px; display: flex; align-items: center">Save</a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 16px; padding: 8px 16px">
    <div style="display: flex; flex-direction: column; gap: 6px"><label class="lab" for="t">Title</label><input class="inp" id="t" value="Pay electricity bill" style="border: 2px solid #0F6B5C"></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><label class="lab" for="d">Description <span style="font-weight: 500; color: #5B6461">(optional)</span></label><textarea id="d" style="height: 84px; border: 1px solid #C9D1CE; border-radius: 14px; background: #FFFFFF; padding: 12px 14px; font: 500 15px 'Plus Jakarta Sans', sans-serif; color: #1A1D1C; resize: none">Consumer no. is in Password notes.</textarea></div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 6px"><label class="lab" for="dt">Date</label>
        <div style="position: relative"><input class="inp" id="dt" value="Wed, 4 Nov" style="padding-left: 42px"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24" style="position: absolute; left: 12px; top: 14px; width: 20px; height: 20px; color: #5B6461"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></div></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label class="lab" for="tm">Time</label>
        <div style="position: relative"><input class="inp" id="tm" value="10:00 AM" style="padding-left: 42px"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24" style="position: absolute; left: 12px; top: 14px; width: 20px; height: 20px; color: #5B6461"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span class="lab">Repeat</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button class="chip" aria-pressed="false">Once</button>
        <button class="chip" aria-pressed="false">Daily</button>
        <button class="chip" aria-pressed="false">Weekly</button>
        <button class="chip" aria-pressed="true">Monthly</button>
        <button class="chip" aria-pressed="false">Yearly</button>
      </div>
      <span style="font-size: 12px; color: #5B6461">Repeats on the 4th of every month</span>
    </div>

    <div style="background: #EEF3F1; border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; align-items: center">
      <svg class="ic" aria-hidden="true" viewBox="0 0 24 24" style="color: #0F6B5C; width: 20px; height: 20px"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg>
      <span style="font-size: 13px; color: #3E4643; line-height: 1.4">You'll be notified on this phone, even offline. Snooze from the notification.</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
