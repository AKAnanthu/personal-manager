include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/gen/**
    # Generated by drift_dev make-migrations.
    - test/drift/**
    - lib/core/db/app_database.steps.dart
    - android/**
    - ios/**
  errors:
    # Generated l10n and drift files are excluded; keep public API docs
    # optional for an app (not a package).
    public_member_api_docs: ignore

linter:
  rules:
    avoid_print: true
    # Dart 3.13 primary-constructor style; keep conventional constructors.
    unnecessary_type_name_in_constructor: false
