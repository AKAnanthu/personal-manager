name: personal_life_manager
description: "Personal Life Manager - local-first personal organiser."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.6.0
  audioplayers: ^6.8.1
  bloc_concurrency: ^0.3.0
  crypto: ^3.0.8
  cryptography: ^2.9.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  equatable: ^3.0.0
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_quill: ^11.6.0
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  get_it: ^9.3.0
  go_router: ^18.1.2
  image_picker: ^1.2.4
  intl: ^0.20.3
  local_auth: ^3.0.2
  logger: ^2.8.0
  lucide_icons_flutter: ^4.0.1
  open_filex: ^5.0.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfrx: ^2.11.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  stream_transform: ^2.1.2
  timezone: ^0.11.2
  uuid: ^4.6.0
  wakelock_plus: ^1.8.2

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.2
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    # The "how to send a list" image (one per language, rendered from
    # design/screens/ShareCard.dc.html at 3x).
    - assets/share/
    # Breathing exercise completion chime (synthesised, no licence needed).
    - assets/sounds/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
